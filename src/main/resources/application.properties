spring.application.name=caronaapi
# "dev" (H2 em memória) por padrão pra rodar local sem configurar nada.
# Implantações reais devem sobrescrever com a variável de ambiente
# SPRING_PROFILES_ACTIVE=prod (o valor abaixo é só o padrão local).
spring.profiles.active=dev

osrm.base-url=http://router.project-osrm.org
nominatim.base-url=https://nominatim.openstreetmap.org

spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packagesToScan=com.generation.carona_api.controller
springdoc.swagger-ui.use-root-path=true
