# create (não update): o schema é derrubado e recriado do zero a partir
# das entidades a cada deploy. Evita conflito quando uma entidade ganha
# campo novo (ex.: nomeReal, aceitaPet, vagasDisponiveis) — o Hibernate
# em modo "update" tenta um ALTER TABLE ADD COLUMN NOT NULL sem valor
# padrão em cima de linhas já existentes, o que o Postgres rejeita.
# Efeito colateral aceito: TODOS os dados desse banco são apagados a
# cada deploy (o DatabaseSeeder recria as contas de demonstração).
spring.jpa.hibernate.ddl-auto=create

# sslmode=require: a Neon exige conexão SSL.
# prepareThreshold=0: o host é o "pooler" da Neon (PgBouncer em modo
# transaction) — sem isso, o driver tenta reusar prepared statements
# nomeados entre conexões físicas diferentes do pool e a Neon responde
# com erro "prepared statement ... does not exist" de forma
# intermitente.
spring.datasource.url=jdbc:postgresql://${POSTGRESHOST}:${POSTGRESPORT}/${POSTGRESDATABASE}?sslmode=require&prepareThreshold=0
spring.datasource.username=${POSTGRESUSER}
spring.datasource.password=${POSTGRESPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver