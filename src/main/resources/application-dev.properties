# Perfil de desenvolvimento local: banco H2 em memória — sobe na hora,
# sem instalar nada, mas os dados somem a cada reinício (mesma ideia do
# mock-server.mjs que o front usava antes). Pra persistir de verdade,
# troque para o profile de MySQL/Postgres.
spring.datasource.url=jdbc:h2:mem:caronaapi;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Console web do H2 em http://localhost:8080/h2-console (JDBC URL acima) —
# só para inspecionar os dados durante o desenvolvimento.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
